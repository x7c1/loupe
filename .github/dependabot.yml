# Weekly update pull requests, on Monday a few hours before vesper lists the
# updates it did not merge. Minor and patch updates of each ecosystem
# arrive as one grouped pull request; major updates stay one pull request
# each, so a failing one points at the dependency that broke. Security
# updates are not grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # @types/vscode must not be newer than engines.vscode, or `vsce package`
      # refuses to build. Raise both together by hand when dropping support
      # for older VS Code versions.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node follows the Node.js major that VS Code's extension host
      # runs, not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
